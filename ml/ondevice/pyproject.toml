[project]
name = "farmerapp-ondevice"
version = "1.0.0"
description = "FarmerApp DX-001 on-device plant / quality / crop classifier: training, int8 TFLite export, evaluation, benchmark"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tensorflow==2.21.0",
    "ai-edge-litert==2.2.0",
    "numpy>=1.26,<3",
    "pillow==11.3.0",
    "pyarrow==21.0.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
extend-exclude = [".venv", "data/raw", "data/cache", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
