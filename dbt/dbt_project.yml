# FarmerApp analytics (SPEC 5, AN-004..014). Datastream replicates Cloud SQL into BigQuery
# dataset farmerapp_raw (infra/modules/analytics); dbt builds
#   staging  (farmerapp_staging)  one typed, deduplicated view per replicated table, PII dropped
#   marts    (farmerapp_marts)    SPEC 5.2 KPIs and the AN-001..AN-009 dashboards
#   views    (farmerapp_views)    authorised views, one row per (viewer, allowed mart row) (AN-013)
# Targets: `ci` = DuckDB over the fixture seeds in seeds/raw (no cloud credentials);
# `dev` / `stg` / `prd` = BigQuery. See README.md.
name: farmerapp
version: "0.1.0"
config-version: 2

profile: farmerapp

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

require-dbt-version: [">=1.10.0", "<2.0.0"]

flags:
  send_anonymous_usage_stats: false

vars:
  # Marts are computed "as of" this IST date. Unset = today in IST; the ci target pins the
  # fixture date (macros/as_of.sql). Override: dbt build --vars '{as_of: 2026-09-15}'.
  as_of: null
  # Role families of the authorised views (AN-013; SPEC 2.6 role scopes).
  tenant_wide_roles: ["owner", "director", "tenant_admin", "auditor"]

models:
  farmerapp:
    +materialized: view
    staging:
      +schema: staging
      +materialized: view
      +tags: ["staging"]
    marts:
      +schema: marts
      +materialized: table
      +tags: ["marts"]
      # BigQuery only (ignored by DuckDB): every mart is clustered by tenant; the daily and
      # weekly marts also set partition_by in their own config.
      +cluster_by: ["tenant_id"]
    views:
      +schema: views
      +materialized: view
      +tags: ["authorised_views"]

seeds:
  farmerapp:
    # Fixtures mimicking the Datastream raw tables (public_<table>). Loaded ONLY by the ci
    # target: on BigQuery the real farmerapp_raw tables belong to Datastream.
    +enabled: "{{ target.name == 'ci' }}"
    raw:
      +schema: raw
      +tags: ["fixtures"]
      # Column types per seed: seeds/_seeds.yml (generated by scripts/gen_seed_types.py).
