[project]
name = "farmerapp-dbt"
version = "0.1.0"
description = "FarmerApp analytics (SPEC 5): dbt staging and marts over the Datastream replica."
requires-python = ">=3.12,<3.13"
# Pinned: dbt behaviour (parsing, macros, adapters) changes between minors. The duckdb adapter
# runs the `ci` target over fixtures; the bigquery adapter runs dev / stg / prd.
dependencies = [
    "dbt-core==1.11.15",
    "dbt-duckdb==1.11.0",
    "dbt-bigquery==1.12.1",
]

[tool.uv]
package = false
