# SPEC 10.3 ci-dbt: dbt build against the dev BigQuery dataset + tests.
# Skeleton: skips while dbt/ has no models (M7 adds them) or WIF is unset.
name: ci-dbt

on:
  pull_request:
    paths:
      - "dbt/**"
      - ".github/workflows/ci-dbt.yml"

permissions:
  contents: read

concurrency:
  group: ci-dbt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_models: ${{ steps.models.outputs.has_models }}
    steps:
      - uses: actions/checkout@v4
      - id: models
        run: |
          count=$(find dbt/models -name '*.sql' 2>/dev/null | wc -l | tr -d ' ')
          echo "found ${count} dbt models"
          if [ "$count" -gt 0 ]; then echo "has_models=true" >> "$GITHUB_OUTPUT"; else echo "has_models=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: detect
    if: needs.detect.outputs.has_models == 'true' && vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_DEV }}

      - run: pip install dbt-bigquery

      - name: dbt deps + build (dev)
        env:
          DBT_PROFILES_DIR: .
          DBT_TARGET: dev
          DBT_PROJECT_ID: farmerapp-dev
        run: |
          dbt deps
          dbt build --target "$DBT_TARGET" --fail-fast

  skip:
    needs: detect
    if: needs.detect.outputs.has_models != 'true' || vars.WIF_PROVIDER == ''
    runs-on: ubuntu-latest
    steps:
      - run: echo "ci-dbt skipped (no models under dbt/models or WIF_PROVIDER unset)"
