# SPEC 10.3 ci-dbt: dbt build + tests on every PR touching dbt.
#
#   Every dbt invocation goes through scripts/dbt_run.py (OPS-011): it runs dbt and then
#   emits the structured JSON lines the Cloud Monitoring log metrics alert on. On the
#   bigquery-dev job DBT_CLOUD_LOG_PROJECT also writes them to Cloud Logging with the run's
#   WIF credentials, so a failed dbt run raises the OPS-011 ticket even though the scheduled
#   dbt Cloud Run job does not exist yet.
#
#   fixtures      always: replication allowlist check (AN-014) and `dbt build --target ci` on
#                 DuckDB over the fixture seeds -- every model, every generic test (AN-012),
#                 the KPI reconciliations, row scopes (AN-013), PII (AN-014) and the freshness
#                 contract (AN-010). No cloud, no credentials.
#   bigquery-dev  only when WIF is configured AND the dbt service account is published
#                 (vars.DBT_SA_DEV, set by a human once the dev stream is running -- until then
#                 farmerapp_raw has no tables to build on): `dbt build --target dev` against the
#                 dev BigQuery datasets, then `dbt source freshness` (informational in dev: dev
#                 has no steady traffic; the scheduled dbt job enforces it in stg / prd).
name: ci-dbt

on:
  pull_request:
    paths:
      - "dbt/**"
      - "infra/modules/analytics/replicated_columns.json"
      - ".github/workflows/ci-dbt.yml"

permissions:
  contents: read

concurrency:
  group: ci-dbt-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DBT_PROFILES_DIR: .

jobs:
  fixtures:
    name: dbt build (DuckDB fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v6

      - name: Install dbt (uv.lock)
        run: uv sync --frozen

      - name: Replication allowlist = dbt sources = fixtures (AN-014)
        run: uv run python scripts/check_replication.py

      - name: OPS-011 result wrapper self-test
        run: uv run python scripts/dbt_run.py --self-test

      - name: dbt build --target ci
        run: uv run python scripts/dbt_run.py build --target ci --fail-fast

      - name: Upload dbt artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dbt-ci-target
          path: |
            dbt/target/run_results.json
            dbt/target/compiled
            dbt/logs
          retention-days: 7

  bigquery-dev:
    name: dbt build (dev BigQuery)
    needs: fixtures
    if: vars.WIF_PROVIDER != '' && vars.DBT_SA_DEV != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v6

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DBT_SA_DEV }}

      - name: Install dbt (uv.lock)
        run: uv sync --frozen

      - name: dbt build --target dev
        env:
          DBT_PROJECT_ID: farmerapp-dev
          DBT_CLOUD_LOG_PROJECT: farmerapp-dev
        run: uv run python scripts/dbt_run.py build --target dev --fail-fast

      # Informational in dev (no steady traffic, so sources are legitimately quiet), but the
      # lines still reach Cloud Logging: they are what OPS-011 alerts on in stg / prd.
      - name: dbt source freshness (AN-010, informational in dev)
        continue-on-error: true
        env:
          DBT_PROJECT_ID: farmerapp-dev
          DBT_CLOUD_LOG_PROJECT: farmerapp-dev
        run: uv run python scripts/dbt_run.py source freshness --target dev
