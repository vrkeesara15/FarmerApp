# SPEC 11.1 pipeline security checks, on every PR and nightly (02:30 IST).
#   SEC-001 gitleaks   SEC-002 semgrep   SEC-003 osv-scanner
#   SEC-004/005 trivy (fs + IaC config)
#   SEC-007 licence compliance (no AGPL in shipped apps) — scripts/licences/,
#           policy in docs/licence-policy.md
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *" # 02:30 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (SEC-001)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: semgrep (SEC-002)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: >-
          semgrep scan
          --config p/python --config p/typescript --config p/owasp-top-ten
          --error --metrics=off
          --exclude '**/node_modules/**' --exclude '**/.dart_tool/**' --exclude '**/build/**'

  trivy:
    name: trivy fs + config (SEC-003/004/005)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: trivy fs (dependencies + secrets)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-fs.sarif

      - name: trivy config (Terraform, Dockerfiles, workflows)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-config.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
        continue-on-error: true

      - name: Upload config SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
        continue-on-error: true

  osv-scanner:
    name: osv-scanner (SEC-003)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./

  # scripts/licences/check_licences.py is the gate; scripts/licences/allowlist.toml
  # is the policy (allowed SPDX ids, denied ids, reviewed per-package exceptions).
  # Rationale and the exception process: docs/licence-policy.md.
  licences:
    name: licence compliance, no AGPL in shipped apps (SEC-007)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # uv gives us the *shipped runtime* dependency set (uv export --no-dev),
      # so pytest/ruff/mypy are not judged as if we shipped them.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      # Same action/channel as ci-mobile.yml; `flutter pub get` populates the
      # pub cache the dart scan reads LICENSE files from.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sync apps/api (runtime deps only)
        working-directory: apps/api
        run: uv sync --frozen --no-dev

      - name: Install apps/console production deps
        working-directory: apps/console
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Resolve pub packages
        working-directory: apps/mobile
        run: flutter pub get

      # --strict: an ecosystem we cannot scan fails the job. A licence gate
      # that silently scans nothing is worse than no gate at all.
      - name: Check licences (python, node, dart)
        run: |
          python3 scripts/licences/check_licences.py \
            --ecosystem all --strict --json licence-report.json

      - name: Upload licence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licence-report
          path: licence-report.json
          if-no-files-found: warn
          retention-days: 90
