# SPEC 11.1 pipeline security checks, on every PR and nightly (02:30 IST).
#   SEC-001 gitleaks   SEC-002 semgrep   SEC-003 osv-scanner
#   SEC-004/005 trivy (fs + IaC config)   SEC-007 license check (no AGPL)
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *" # 02:30 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (SEC-001)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: semgrep (SEC-002)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: >-
          semgrep scan
          --config p/python --config p/typescript --config p/owasp-top-ten
          --error --metrics=off
          --exclude '**/node_modules/**' --exclude '**/.dart_tool/**' --exclude '**/build/**'

  trivy:
    name: trivy fs + config (SEC-003/004/005)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: trivy fs (dependencies + secrets)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-fs.sarif

      - name: trivy config (Terraform, Dockerfiles, workflows)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-config.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
        continue-on-error: true

      - name: Upload config SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
        continue-on-error: true

  osv-scanner:
    name: osv-scanner (SEC-003)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./

  licenses:
    name: license check, no AGPL (SEC-007)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python (apps/api)
        if: hashFiles('apps/api/pyproject.toml') != ''
        working-directory: apps/api
        run: |
          pip install -q -e . pip-licenses
          pip-licenses --format=markdown --with-urls
          pip-licenses --fail-on="GNU Affero General Public License v3;AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later;GNU Affero General Public License v3 or later (AGPLv3+)"

      - uses: actions/setup-node@v4
        if: hashFiles('apps/console/package-lock.json') != ''
        with:
          node-version: "22"

      - name: Node (apps/console)
        if: hashFiles('apps/console/package-lock.json') != ''
        working-directory: apps/console
        run: |
          npm ci --ignore-scripts
          npx --yes license-checker --production --summary --failOn "AGPL-1.0;AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later"

      - name: Dart (apps/mobile)
        if: hashFiles('apps/mobile/apps/farmer/pubspec.yaml') != ''
        run: |
          # pub.dev packages declare licenses in LICENSE files; grep resolved packages for AGPL.
          echo "Dart license scan runs in ci-mobile once tool/check.sh includes it (TODO SEC-007)."
