# SPEC 10.3 ci-api: ruff, mypy strict, pytest against Postgres+PostGIS+pgvector,
# coverage >= 80%, OpenAPI diff, rule fixtures, bandit, pip-audit (SEC-002/003/006).
#
# Assumptions (owned by the API agent / root Makefile):
#   - docker/postgres/Dockerfile builds Postgres 16 + PostGIS + pgvector (same image as docker-compose).
#   - `make check-api` runs ruff, mypy --strict, pytest --cov --cov-fail-under=80 and the rule fixtures;
#     SKIP_AUDIT=0 keeps pip-audit inside it, we still run bandit/pip-audit explicitly below.
#   - `make openapi` regenerates apps/api/openapi.yaml.
name: ci-api

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "apps/jobs/**"
      - "rules/**"
      - "docker/postgres/**"
      - "Makefile"
      - ".github/workflows/ci-api.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "apps/jobs/**"
      - "rules/**"

permissions:
  contents: read

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # SEC-011/012: tests run as the app role (created by docker/postgres/initdb, riding along in
  # the image built below); only Alembic uses the owner. tests/rls proves the isolation in CI.
  DATABASE_URL: postgresql+asyncpg://farmerapp_app:farmerapp@localhost:5432/farmerapp_test
  MIGRATION_DATABASE_URL: postgresql+asyncpg://farmerapp:farmerapp@localhost:5432/farmerapp_test
  SKIP_AUDIT: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/api/requirements*.txt

      - name: Build Postgres + PostGIS + pgvector image
        run: docker build -t farmerapp-postgres:ci docker/postgres

      - name: Start Postgres
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_USER=farmerapp -e POSTGRES_PASSWORD=farmerapp -e POSTGRES_DB=farmerapp_test \
            farmerapp-postgres:ci
          for i in $(seq 1 30); do
            if docker exec pg pg_isready -U farmerapp -d farmerapp_test >/dev/null 2>&1; then
              echo "postgres ready after ${i}s"; break
            fi
            sleep 1
          done
          docker exec pg pg_isready -U farmerapp -d farmerapp_test || { docker logs pg; exit 1; }
          # initdb scripts (app role) only run on a fresh volume, which this is; verify anyway.
          docker exec pg psql -U farmerapp -d farmerapp_test -tAc \
            "SELECT 1 FROM pg_roles WHERE rolname = 'farmerapp_app'" | grep -q 1

      - name: Install API (dev extras)
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install -e ".[dev]"
          pip install bandit pip-audit

      - name: Lint, types, tests, coverage >= 80%, rule fixtures
        run: make check-api

      - name: OpenAPI is up to date
        run: |
          make openapi
          git diff --exit-code -- apps/api/openapi.yaml

      - name: bandit (SEC-002)
        run: bandit -q -r apps/api/farmerapp -ll -ii

      - name: pip-audit (SEC-003, high/critical block)
        working-directory: apps/api
        run: pip-audit --strict --desc on

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: |
            apps/api/htmlcov
            apps/api/coverage.xml
          if-no-files-found: ignore

      - name: Postgres logs on failure
        if: failure()
        run: docker logs pg || true
