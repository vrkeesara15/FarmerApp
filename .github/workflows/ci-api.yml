# SPEC 10.3 ci-api: ruff, mypy strict, pytest against Postgres+PostGIS+pgvector,
# coverage >= 80%, OpenAPI diff, rule fixtures, bandit, pip-audit (SEC-002/003/006).
#
# Assumptions (owned by the API agent / root Makefile):
#   - docker/postgres/Dockerfile builds Postgres 16 + PostGIS 3 + pgvector (same image as docker-compose)
#     on the multi-arch official postgres:16-bookworm base (ADR 0004); amd64 here, arm64 on Macs.
#   - `make check-api` runs ruff, mypy --strict, pytest --cov --cov-fail-under=80 and the rule fixtures;
#     SKIP_AUDIT=0 keeps pip-audit inside it, we still run bandit/pip-audit explicitly below.
#   - pytest runs in parallel exactly as locally: `pytest -n auto --dist worksteal -m "not serial"`
#     (pytest-xdist, one worker per runner core = 4), each worker on its own database cloned from a
#     migrated template (apps/api/tests/conftest.py), then the `serial` timing test alone with
#     --cov-append; the 80% gate applies to the combined coverage of both phases. `make check-api` runs everything through `uv run` (uv.lock), hence setup-uv.
#   - `make openapi` regenerates apps/api/openapi.yaml.
name: ci-api

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "apps/jobs/**"
      - "rules/**"
      - "docker/postgres/**"
      - ".dockerignore"
      - "Makefile"
      - ".github/workflows/ci-api.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "apps/jobs/**"
      - "rules/**"

permissions:
  contents: read

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # SEC-011/012: tests run as the app role (created by docker/postgres/initdb, riding along in
  # the image built below); only Alembic uses the owner. tests/rls proves the isolation in CI.
  DATABASE_URL: postgresql+asyncpg://farmerapp_app:farmerapp@localhost:5432/farmerapp_test
  MIGRATION_DATABASE_URL: postgresql+asyncpg://farmerapp:farmerapp@localhost:5432/farmerapp_test
  SKIP_AUDIT: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/api/requirements*.txt

      - uses: astral-sh/setup-uv@v6

      - name: Build Postgres + PostGIS + pgvector image
        run: docker build -t farmerapp-postgres:ci docker/postgres

      - name: Start Postgres
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_USER=farmerapp -e POSTGRES_PASSWORD=farmerapp -e POSTGRES_DB=farmerapp_test \
            farmerapp-postgres:ci
          for i in $(seq 1 30); do
            if docker exec pg pg_isready -U farmerapp -d farmerapp_test >/dev/null 2>&1; then
              echo "postgres ready after ${i}s"; break
            fi
            sleep 1
          done
          docker exec pg pg_isready -U farmerapp -d farmerapp_test || { docker logs pg; exit 1; }
          # initdb scripts (app role) only run on a fresh volume, which this is; verify anyway.
          docker exec pg psql -U farmerapp -d farmerapp_test -tAc \
            "SELECT 1 FROM pg_roles WHERE rolname = 'farmerapp_app'" | grep -q 1

      - name: Install API (dev extras)
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install -e ".[dev]"
          pip install bandit pip-audit

      - name: Lint, types, tests (parallel, per-worker databases), coverage >= 80%, rule fixtures
        run: make check-api API_TEST_WORKERS=auto

      - name: OpenAPI is up to date
        run: |
          make openapi
          git diff --exit-code -- apps/api/openapi.yaml

      - name: bandit (SEC-002)
        run: bandit -q -r apps/api/farmerapp -ll -ii

      - name: pip-audit (SEC-003, high/critical block)
        working-directory: apps/api
        run: pip-audit --strict --desc on

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: |
            apps/api/htmlcov
            apps/api/coverage.xml
          if-no-files-found: ignore

      - name: Postgres logs on failure
        if: failure()
        run: docker logs pg || true

  # VA-001: the api / worker / jobs images are built from the repo root and carry rules/
  # (RULES_DIR=/app/rules); a deployed service without it logs rules_dir_missing and runs no
  # rules. Build each image and validate the baked-in rules with the image's own code.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        name: [api, worker, jobs]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image (repo root context)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.name }}/Dockerfile
          load: true
          push: false
          tags: farmerapp-${{ matrix.name }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,scope=ci-${{ matrix.name }},mode=max

      - name: Rules are in the image and valid
        # every rules/*.yaml of the checkout (11 P0 rules at M4) must be in the image
        run: |
          expected=$(find rules -maxdepth 1 -name '*.yaml' | wc -l | tr -d ' ')
          out=$(docker run --rm --entrypoint python farmerapp-${{ matrix.name }}:ci \
            -m farmerapp.jobs validate-rules)
          echo "$out"
          echo "$out" | grep -q "validate-rules: ${expected} rules OK" \
            || { echo "::error::image has not the ${expected} rules of rules/"; exit 1; }
