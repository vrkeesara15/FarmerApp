# SPEC 10.3 ci-mobile: flutter analyze, dart format, unit + widget + golden tests
# (via apps/mobile/tool/check.sh), debug APKs for both apps, farmer APK < 25 MB.
#
# NF-001: the size gate is per ABI, not on a fat APK. Play delivers one ABI to
# each device, so the budget that matters is the largest single-ABI APK -- and
# armeabi-v7a, the one this skipped when it built arm64 only, is exactly the
# older, cheaper phone NF-001 is written for. `APK_SIZE_CHECK=1 ./tool/check.sh`
# builds both (obfuscated, R8, like a release) and fails on the larger one.
name: ci-mobile

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ci-mobile.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"

permissions:
  contents: read

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FARMER_APK_LIMIT_MB: "25"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: analyze, format, tests, goldens, APK size per ABI
        working-directory: apps/mobile
        env:
          APK_SIZE_CHECK: "1"
          APK_MAX_MB: ${{ env.FARMER_APK_LIMIT_MB }}
        run: ./tool/check.sh

      - name: Build debug APKs
        working-directory: apps/mobile
        run: |
          for app in agent farmer; do
            (cd "apps/$app" && flutter build apk --debug)
          done

      # The per-ABI release build and its 25 MB gate run inside check.sh above
      # (tool/apk_size_check.sh), so the same command a developer runs locally
      # is the one CI runs.

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            apps/mobile/apps/agent/build/app/outputs/flutter-apk/app-debug.apk
            apps/mobile/apps/farmer/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
