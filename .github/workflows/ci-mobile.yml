# SPEC 10.3 ci-mobile: flutter analyze, dart format, unit + widget + golden tests
# (via apps/mobile/tool/check.sh), debug APKs for both apps, farmer APK < 25 MB.
name: ci-mobile

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ci-mobile.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"

permissions:
  contents: read

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FARMER_APK_LIMIT_MB: "25"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: analyze, format, tests, goldens
        working-directory: apps/mobile
        run: ./tool/check.sh

      - name: Build debug APKs
        working-directory: apps/mobile
        run: |
          for app in agent farmer; do
            (cd "apps/$app" && flutter build apk --debug)
          done

      # Debug APKs carry the JIT runtime, so the size gate uses a release build
      # of the farmer app (debug-signed, not shipped).
      - name: Farmer release APK size < 25 MB (FM-014)
        working-directory: apps/mobile/apps/farmer
        run: |
          flutter build apk --release --target-platform android-arm64
          apk=build/app/outputs/flutter-apk/app-release.apk
          size_mb=$(( $(stat -c %s "$apk") / 1024 / 1024 ))
          echo "farmer release APK: ${size_mb} MB (limit ${FARMER_APK_LIMIT_MB} MB)"
          if [ "$size_mb" -ge "$FARMER_APK_LIMIT_MB" ]; then
            echo "::error::farmer APK ${size_mb} MB exceeds ${FARMER_APK_LIMIT_MB} MB"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            apps/mobile/apps/agent/build/app/outputs/flutter-apk/app-debug.apk
            apps/mobile/apps/farmer/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
