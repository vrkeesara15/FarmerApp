# SPEC 9.7: weekly drift detection — terraform plan on every env, open (or
# update) an issue when a plan is non-empty. Plan only; never applies.
name: drift

on:
  schedule:
    - cron: "30 22 * * 0" # Monday 04:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drift
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.3"
  TF_IN_AUTOMATION: "1"

jobs:
  plan:
    if: vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        env: [dev, stg, prd]
    steps:
      - uses: actions/checkout@v4

      - name: Pick deployer SA for ${{ matrix.env }}
        id: sa
        run: |
          case "${{ matrix.env }}" in
            dev) sa="${{ vars.DEPLOY_SA_DEV }}" ;;
            stg) sa="${{ vars.DEPLOY_SA_STG }}" ;;
            prd) sa="${{ vars.DEPLOY_SA_PRD }}" ;;
          esac
          echo "email=$sa" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        if: steps.sa.outputs.email != ''
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ steps.sa.outputs.email }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform plan (${{ matrix.env }})
        id: plan
        if: steps.sa.outputs.email != ''
        working-directory: infra/envs/${{ matrix.env }}
        run: |
          terraform init -input=false -no-color
          set +e
          terraform plan -input=false -no-color -lock=false -detailed-exitcode > plan.txt 2>&1
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          tail -n 200 plan.txt
          if [ "$code" -eq 1 ]; then exit 1; fi

      - name: Open or update drift issue
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = '${{ matrix.env }}';
            let plan = fs.readFileSync(`infra/envs/${env}/plan.txt`, 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated)';
            const title = `[drift] terraform plan is not empty for ${env}`;
            const body = `Weekly drift detection found changes in **${env}** (run ${context.runId}).\n\n` +
              `Someone changed infrastructure outside Terraform, or a merged change was not applied. ` +
              `Reconcile via a PR, or for stg/prd a human-run apply.\n\n<details><summary>Plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'drift' });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['drift', 'infra'] });
            }

      - name: Skipped
        if: steps.sa.outputs.email == ''
        run: echo "No deployer SA variable for ${{ matrix.env }}; skipping."
