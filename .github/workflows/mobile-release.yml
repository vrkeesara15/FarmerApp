# SPEC 10.3 mobile-release: on tag agent-v* / farmer-v*, build a signed AAB
# (upload keystore from Secret Manager via WIF, no keys in GitHub), MobSF scan
# (SEC-008), upload to the Play internal track. Promotion to closed/production
# is manual in Play Console (human gate, SPEC 14.6).
#
# Secrets expected in farmerapp-ops Secret Manager (added by an admin):
#   play-upload-keystore-<app>   base64 of the .jks
#   play-upload-keystore-<app>-password, play-upload-key-<app>-alias, play-upload-key-<app>-password
# The deployer SA must be invited to the Play Console as a release user.
name: mobile-release

on:
  push:
    tags:
      - "agent-v*"
      - "farmer-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  OPS_PROJECT: farmerapp-ops
  MOBSF_HIGH_LIMIT: "0"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: play-internal
    steps:
      - uses: actions/checkout@v4

      - name: Resolve app from tag
        id: app
        run: |
          tag="${GITHUB_REF_NAME}"
          app="${tag%%-v*}"
          version="${tag#*-v}"
          case "$app" in
            agent)  package="in.farmerapp.agent" ;;
            farmer) package="in.farmerapp.farmer" ;;
            *) echo "::error::unknown app in tag $tag"; exit 1 ;;
          esac
          {
            echo "app=$app"
            echo "version=$version"
            echo "package=$package"
            echo "build_number=${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: google-github-actions/auth@v2
        if: vars.WIF_PROVIDER != ''
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_PRD }}

      - uses: google-github-actions/setup-gcloud@v2
        if: vars.WIF_PROVIDER != ''

      - name: Fetch upload keystore from Secret Manager
        if: vars.WIF_PROVIDER != ''
        working-directory: apps/mobile/apps/${{ steps.app.outputs.app }}/android
        run: |
          app="${{ steps.app.outputs.app }}"
          gcloud secrets versions access latest --project "$OPS_PROJECT" --secret "play-upload-keystore-${app}" | base64 -d > upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$(gcloud secrets versions access latest --project "$OPS_PROJECT" --secret "play-upload-keystore-${app}-password")"
            echo "keyAlias=$(gcloud secrets versions access latest --project "$OPS_PROJECT" --secret "play-upload-key-${app}-alias")"
            echo "keyPassword=$(gcloud secrets versions access latest --project "$OPS_PROJECT" --secret "play-upload-key-${app}-password")"
          } > key.properties
          chmod 600 key.properties upload-keystore.jks

      - name: Build signed AAB (obfuscated, SEC-008)
        working-directory: apps/mobile/apps/${{ steps.app.outputs.app }}
        run: |
          flutter build appbundle --release \
            --build-name "${{ steps.app.outputs.version }}" \
            --build-number "${{ steps.app.outputs.build_number }}" \
            --obfuscate --split-debug-info=build/symbols
          ls -la build/app/outputs/bundle/release/

      # Every gate below inspects the *shipped bytes*. The AAB's manifest is
      # binary XML (AXML), so grepping it for the ASCII string "debuggable"
      # proves nothing either way; instead we assemble the universal APK Play
      # would install and read it with the Android SDK's own tools.
      - name: Build universal APK for the security gates (SEC-008)
        working-directory: apps/mobile/apps/${{ steps.app.outputs.app }}
        env:
          BUNDLETOOL_VERSION: "1.18.1"
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          # A throwaway key: this APK is only ever read by the gates below and
          # is never installed or published. The real upload key stays untouched.
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/analysis.jks" \
            -storepass analysis -keypass analysis -alias analysis \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=apk analysis" >/dev/null
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output="$RUNNER_TEMP/universal.apks" --mode=universal --overwrite \
            --ks="$RUNNER_TEMP/analysis.jks" --ks-pass=pass:analysis \
            --ks-key-alias=analysis --key-pass=pass:analysis
          unzip -o -q "$RUNNER_TEMP/universal.apks" -d "$RUNNER_TEMP/universal"
          mv "$RUNNER_TEMP/universal/universal.apk" build/app-release-universal.apk
          ls -la build/app-release-universal.apk

      # aapt2 dump xmltree on the merged manifest: android:debuggable absent or
      # false, allowBackup=false, data-extraction + backup rules and a network
      # security config present, no global cleartext. Exits 2 (failing the job)
      # when aapt2 is missing — it never passes by accident.
      #
      # android:extractNativeLibs is deliberately *true* here
      # (useLegacyPackaging in build.gradle.kts, FM-014 APK budget), so it is
      # not asserted false; see docs/runbooks/mobile-security-scan.md.
      - name: Release manifest gate — not debuggable (SEC-008)
        working-directory: apps/mobile/apps/${{ steps.app.outputs.app }}
        run: ../../tool/check_release_manifest.sh build/app-release-universal.apk

      - name: Obfuscation gate — Dart symbols split out, R8 on (SEC-008)
        working-directory: apps/mobile/apps/${{ steps.app.outputs.app }}
        run: |
          "$GITHUB_WORKSPACE/scripts/mobile/apk_obfuscation_check.sh" \
            build/app-release-universal.apk \
            build/symbols \
            android/app/build.gradle.kts

      - name: Secrets gate — nothing credential-shaped in the APK (SEC-008)
        working-directory: apps/mobile/apps/${{ steps.app.outputs.app }}
        run: |
          "$GITHUB_WORKSPACE/scripts/mobile/apk_secret_scan.sh" \
            build/app-release-universal.apk \
            "$GITHUB_WORKSPACE/.env.example"

      # MobSF runs entirely from the free OSS docker image — no account, no
      # paid tier. If the image cannot be pulled or the API never comes up the
      # job FAILS; set the repository variable MOBSF_OPTIONAL=true only as a
      # deliberate, documented escape hatch (docs/runbooks/mobile-security-scan.md).
      - name: MobSF scan (SEC-008)
        working-directory: apps/mobile/apps/${{ steps.app.outputs.app }}
        env:
          MOBSF_OPTIONAL: ${{ vars.MOBSF_OPTIONAL }}
          MOBSF_IMAGE: opensecurity/mobile-security-framework-mobsf:latest
          MOBSF_API_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -uo pipefail
          apk=build/app-release-universal.apk

          unavailable() {
            echo "::error::MobSF could not run: $*"
            if [ "${MOBSF_OPTIONAL:-}" = "true" ]; then
              echo "::warning::vars.MOBSF_OPTIONAL=true — continuing without the MobSF scan."
              docker logs mobsf 2>&1 | tail -40 || true
              docker rm -f mobsf >/dev/null 2>&1 || true
              exit 0
            fi
            docker logs mobsf 2>&1 | tail -40 || true
            docker rm -f mobsf >/dev/null 2>&1 || true
            exit 1
          }

          docker pull "$MOBSF_IMAGE" || unavailable "docker pull $MOBSF_IMAGE failed"
          docker run -d --name mobsf -p 8000:8000 \
            -e MOBSF_API_KEY="$MOBSF_API_KEY" "$MOBSF_IMAGE" \
            || unavailable "docker run failed"

          ready=""
          for _ in $(seq 1 80); do
            if curl -sf http://localhost:8000/api/v1/scans -H "Authorization: $MOBSF_API_KEY" >/dev/null; then
              ready=yes; break
            fi
            sleep 3
          done
          [ -n "$ready" ] || unavailable "the API did not answer within 4 minutes"

          set -e
          # MobSF analyses the APK, not the AAB: the gates above and MobSF then
          # look at exactly the same bytes.
          up=$(curl -sf -F "file=@${apk}" http://localhost:8000/api/v1/upload -H "Authorization: $MOBSF_API_KEY")
          hash=$(printf '%s' "$up" | python3 -c 'import json,sys; print(json.load(sys.stdin)["hash"])')
          curl -sf -X POST http://localhost:8000/api/v1/scan \
            -H "Authorization: $MOBSF_API_KEY" -d "hash=${hash}" >/dev/null
          curl -sf -X POST http://localhost:8000/api/v1/report_json \
            -H "Authorization: $MOBSF_API_KEY" -d "hash=${hash}" > mobsf-report.json
          docker rm -f mobsf >/dev/null

          # MOBSF_HIGH_LIMIT comes from the workflow env; the gate reads it.
          python3 "$GITHUB_WORKSPACE/scripts/mobile/mobsf_gate.py" mobsf-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.app.outputs.app }}-${{ steps.app.outputs.version }}
          path: |
            apps/mobile/apps/${{ steps.app.outputs.app }}/build/app/outputs/bundle/release/app-release.aab
            apps/mobile/apps/${{ steps.app.outputs.app }}/build/symbols
            apps/mobile/apps/${{ steps.app.outputs.app }}/mobsf-report.json
          if-no-files-found: ignore
          retention-days: 90

      # Play Developer API via the WIF access token — no JSON key (SEC-010).
      - name: Upload to Play internal track
        if: vars.WIF_PROVIDER != ''
        working-directory: apps/mobile/apps/${{ steps.app.outputs.app }}
        env:
          PACKAGE: ${{ steps.app.outputs.package }}
          BUILD_NUMBER: ${{ steps.app.outputs.build_number }}
        run: |
          set -euo pipefail
          token=$(gcloud auth print-access-token)
          api="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE}"
          edit=$(curl -sf -X POST "$api/edits" -H "Authorization: Bearer $token" -H "Content-Length: 0" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -sf -X POST "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/${PACKAGE}/edits/${edit}/bundles?uploadType=media" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/octet-stream" \
            --data-binary @build/app/outputs/bundle/release/app-release.aab > /dev/null
          curl -sf -X PUT "$api/edits/${edit}/tracks/internal" -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d "{\"track\":\"internal\",\"releases\":[{\"versionCodes\":[\"${BUILD_NUMBER}\"],\"status\":\"completed\"}]}" > /dev/null
          curl -sf -X POST "$api/edits/${edit}:commit" -H "Authorization: Bearer $token" -H "Content-Length: 0" > /dev/null
          echo "Uploaded versionCode ${BUILD_NUMBER} to internal track. Promote manually in Play Console."

      - name: Remove signing material
        if: always()
        working-directory: apps/mobile/apps/${{ steps.app.outputs.app }}/android
        run: rm -f upload-keystore.jks key.properties
