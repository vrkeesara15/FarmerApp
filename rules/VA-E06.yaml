# VA-E06 (SPEC 6.3): duty with no activity — more than `max_idle_hours` on duty without a
# visit (check-in / check-out, meetings included), an arrival at or departure from a stop, or
# any movement of `min_movement_m` (location points with accuracy <= `max_accuracy_m`).
# Second check (coaching): a VV-006 tracking gap during a duty session at least as long as
# the tenant's `unexplained_gap_hours` (default 3) that still carries no VV-008 reason
# `reason_grace_hours` (24 h) after it ended.
id: VA-E06
version: 2
title: Duty with no activity
subject: employee
mode: batch
severity: low
owner_role: cluster_head
sla_hours: 168
enabled: true
params:
  max_idle_hours: 3
  min_movement_m: 100          # the duty track's stop radius (duty/track.py)
  max_accuracy_m: 100
  lookback_hours: 26           # duty sessions overlapping the last night's window
  reason_grace_hours: 24       # how long the officer has to explain a gap (VV-008)
  gap_lookback_hours: 168      # gaps that ended within the last week are still checked
tenant_overrides: {}
