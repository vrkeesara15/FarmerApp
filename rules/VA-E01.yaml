# VA-E01 (SPEC 6.3): mock location, rooted device or clock drift above the limit while on
# duty — from the duty start, location batches and visit check-in integrity signals (FA-028).
# One flag per officer and IST day.
id: VA-E01
version: 1
title: Device integrity on duty
subject: employee
mode: event
triggers: [duty.started, location.batch, visit.created]
severity: high
owner_role: cluster_head
sla_hours: 48
enabled: true
params:
  max_clock_drift_s: 300      # |device - server| above this is tampering (> 5 min)
  max_evidence_points: 20     # location points cited per flag
tenant_overrides: {}
