description: >
  A photo on a visit to farmer f2 is 3 bits (pHash) away from a photo taken on a visit to
  farmer f1: the same field photographed once and reused. A high severity farmer-data flag
  about f2 for the store manager, watched by the auditor.
mode: event
trigger: visit.photo
subjects: [visit2]
now: "2026-09-18T06:30:00Z"
seed:
  farmers:
    - {ref: f1, at: -30d}
    - {ref: f2, at: -30d}
  visits:
    - {ref: visit1, farmer: f1, at: -2d, minutes: 20, east_m: 100}
    - {ref: visit2, farmer: f2, at: -1h, minutes: 20, east_m: 400}
  photos:
    - {ref: p1, visit: visit1, sha256: "1111111111111111111111111111111111111111111111111111111111111111", phash: "c3a5f00f12345678"}
    - {ref: p2, visit: visit2, sha256: "2222222222222222222222222222222222222222222222222222222222222222", phash: "c3a5f00f1234567f"}
expect:
  flags:
    - {subject: f2, severity: high, owner: store_manager, watchers: [auditor], reasons: [photo_reuse]}
