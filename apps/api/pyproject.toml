[project]
name = "farmerapp"
version = "0.1.0"
description = "FarmerApp backend: API, Pub/Sub worker and batch jobs (one package, three entrypoints)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "geoalchemy2>=0.15",
  "pgvector>=0.3",
  "httpx>=0.27",
  "structlog>=24.1",
  "typer>=0.12",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["farmerapp"]

[tool.uv]
package = true

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "T20"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
# The local alembic/ directory would otherwise make the `alembic` package look first-party.
known-third-party = ["alembic"]
known-first-party = ["farmerapp", "scripts", "tests"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["sqlalchemy.orm.declared_attr.directive", "declared_attr.directive"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["N999"]
"tests/*" = ["S101"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["farmerapp", "tests", "scripts", "alembic"]
plugins = ["pydantic.mypy"]

# Libraries without type information (only add entries here, never inline ignores).
[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --cov=farmerapp --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["error::DeprecationWarning:farmerapp.*"]

[tool.coverage.run]
branch = true
source = ["farmerapp"]
# Process entrypoints are exercised by containers, not unit tests (uvicorn / typer main).
omit = ["farmerapp/jobs/__main__.py"]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
show_missing = true

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
