components:
  schemas:
    AccountingSettings:
      properties:
        sales_ledger_prefix:
          type: string
          maxLength: 60
          minLength: 1
          title: Sales Ledger Prefix
          default: Sales
        output_tax_prefix:
          type: string
          maxLength: 60
          minLength: 1
          title: Output Tax Prefix
          default: Output
        round_off_ledger:
          type: string
          maxLength: 60
          minLength: 1
          title: Round Off Ledger
          default: Round Off
        cash_ledger:
          type: string
          maxLength: 60
          minLength: 1
          title: Cash Ledger
          default: Cash
        upi_ledger:
          type: string
          maxLength: 60
          minLength: 1
          title: Upi Ledger
          default: UPI Collections
        card_ledger:
          type: string
          maxLength: 60
          minLength: 1
          title: Card Ledger
          default: Card Collections
        walk_in_party:
          type: string
          maxLength: 60
          minLength: 1
          title: Walk In Party
          default: Cash Customer
      type: object
      title: AccountingSettings
      description: 'ST-008 ledger names in the tenant''s books (Tally / Zoho). TODO-HUMAN: the accountant

        confirms them against the company''s chart of accounts.'
    AdjustmentIn:
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 3
          title: Reason
        lines:
          items:
            $ref: '#/components/schemas/AdjustmentLineIn'
          type: array
          maxItems: 100
          minItems: 1
          title: Lines
      additionalProperties: false
      type: object
      required:
      - reason
      - lines
      title: AdjustmentIn
      description: 'Stock count correction: the counted quantity per batch; the difference to the ledger

        is written as an ``adjust`` movement (audited, reason required).'
    AdjustmentLineIn:
      properties:
        batch_id:
          type: string
          format: uuid
          title: Batch Id
        counted_qty:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,9}|(?=[\d.]{1,13}0*$)\d{0,9}\.\d{0,3}0*$)
          title: Counted Qty
      additionalProperties: false
      type: object
      required:
      - batch_id
      - counted_qty
      title: AdjustmentLineIn
    AlertListOut:
      properties:
        districts:
          items:
            type: string
          type: array
          title: Districts
        items:
          items:
            $ref: '#/components/schemas/OutbreakAlertOut'
          type: array
          title: Items
      type: object
      required:
      - districts
      - items
      title: AlertListOut
    AppUsageOut:
      properties:
        has_app_login:
          type: boolean
          title: Has App Login
        last_session_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Session At
        sessions_last_60_days:
          type: integer
          title: Sessions Last 60 Days
        proxy:
          type: string
          title: Proxy
          description: How app sessions are measured (refresh-token issuance).
      type: object
      required:
      - has_app_login
      - last_session_at
      - sessions_last_60_days
      - proxy
      title: AppUsageOut
    ApprovalStatus:
      type: string
      enum:
      - pending
      - approved
      - rejected
      - consumed
      title: ApprovalStatus
    ArmOut:
      properties:
        size:
          type: integer
          title: Size
        converted_farmers:
          type: integer
          title: Converted Farmers
        conversion_rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Conversion Rate
        orders:
          type: integer
          title: Orders
        revenue_paise:
          type: integer
          title: Revenue Paise
        own_brand_revenue_paise:
          type: integer
          title: Own Brand Revenue Paise
        own_brand_share:
          anyOf:
          - type: number
          - type: 'null'
          title: Own Brand Share
      type: object
      required:
      - size
      - converted_farmers
      - conversion_rate
      - orders
      - revenue_paise
      - own_brand_revenue_paise
      - own_brand_share
      title: ArmOut
    AskExpertIn:
      properties:
        note:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Note
          description: For the agronomist.
      additionalProperties: false
      type: object
      title: AskExpertIn
      description: FM-006 "Ask an expert" on an answered case.
    AssignIn:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        note:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Note
      additionalProperties: false
      type: object
      required:
      - user_id
      title: AssignIn
    AssignedOfficerOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        phone:
          type: string
          title: Phone
      type: object
      required:
      - id
      - name
      - phone
      title: AssignedOfficerOut
      description: 'FM-011 / F62: the farmer''s field officer (call / WhatsApp from the farmer app).


        ``phone`` is the decrypted number (SEC-026 field cipher) for the farmer themself, the

        officer themself and the roles that read user profiles (``GET /v1/users``); masked

        (``+91******3210``) for every other reader.'
    AttendanceIn:
      properties:
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Id
          description: Client id (offline create).
        method:
          type: string
          enum:
          - otp
          - qr
          title: Method
        farmer_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Farmer Id
          description: Required for `otp`.
        code:
          anyOf:
          - type: string
            pattern: ^\d{6}$
          - type: 'null'
          title: Code
          description: '`otp`: the code.'
        token:
          anyOf:
          - type: string
            maxLength: 4096
            minLength: 16
          - type: 'null'
          title: Token
          description: '`qr`: the scanned token.'
        recorded_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Recorded At
          description: 'When the QR was scanned (offline sync); the token must not have expired by then.
            Default: now.'
      type: object
      required:
      - method
      title: AttendanceIn
    AttendanceOtpIn:
      properties:
        farmer_id:
          type: string
          format: uuid
          title: Farmer Id
      type: object
      required:
      - farmer_id
      title: AttendanceOtpIn
    AttendanceOtpOut:
      properties:
        farmer_id:
          type: string
          format: uuid
          title: Farmer Id
        phone_masked:
          type: string
          title: Phone Masked
        expires_in:
          type: integer
          title: Expires In
        resend_after:
          type: integer
          title: Resend After
        resends_left:
          type: integer
          title: Resends Left
      type: object
      required:
      - farmer_id
      - phone_masked
      - expires_in
      - resend_after
      - resends_left
      title: AttendanceOtpOut
    AttendanceOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        tenant_id:
          type: string
          format: uuid
          title: Tenant Id
        meeting_id:
          type: string
          format: uuid
          title: Meeting Id
        farmer_id:
          type: string
          format: uuid
          title: Farmer Id
        farmer_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Farmer Name
        method:
