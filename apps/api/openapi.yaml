openapi: 3.1.0
info:
  title: FarmerApp API
  description: FarmerApp REST API. Errors are RFC 9457 problem+json with a stable `code`.
  version: 0.1.0
paths:
  /v1/health:
    get:
      tags:
      - health
      summary: Liveness probe
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-public: true
  /v1/auth/otp/send:
    post:
      tags:
      - auth
      summary: Send a 6-digit login code by SMS (WhatsApp fallback after 30 s)
      operationId: sendOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSendRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSendResponse'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`user_not_found`'
          content:
            application/problem+json: {}
        '403':
          description: '`user_disabled`'
          content:
            application/problem+json: {}
        '423':
          description: '`otp_locked`'
          content:
            application/problem+json: {}
        '429':
          description: '`otp_rate_limited`'
          content:
            application/problem+json: {}
      x-public: true
  /v1/auth/otp/verify:
    post:
      tags:
      - auth
      summary: Verify the code; returns access + refresh tokens and the user profile
      operationId: verifyOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`otp_invalid`, `otp_expired`'
          content:
            application/problem+json: {}
        '404':
          description: '`otp_not_found`, `user_not_found`'
          content:
            application/problem+json: {}
        '403':
          description: '`user_disabled`'
          content:
            application/problem+json: {}
        '423':
          description: '`otp_locked`'
          content:
            application/problem+json: {}
      x-public: true
  /v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Rotate the refresh token and issue a new access token
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`refresh_invalid`, `refresh_expired`, `refresh_reused`, `refresh_device_mismatch`'
          content:
            application/problem+json: {}
        '403':
          description: '`user_disabled`'
          content:
            application/problem+json: {}
      x-public: true
  /v1/auth/logout:
    post:
      tags:
      - auth
      summary: Revoke the refresh token family (idempotent)
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-public: true
  /v1/me:
    get:
      tags:
      - me
      summary: Profile of the authenticated user
      operationId: getMe
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - accountant
      - agronomist
      - auditor
      - cluster_head
      - director
      - farmer
      - field_officer
      - owner
      - store_manager
      - tenant_admin
  /v1/users:
    get:
      tags:
      - users
      summary: Users of the caller's tenant (cluster heads see their own cluster)
      operationId: listUsers
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque cursor from `next_cursor`.
          title: Cursor
        description: Opaque cursor from `next_cursor`.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Page size.
          default: 50
          title: Limit
        description: Page size.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOut_UserOut_'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          description: '`invalid_cursor`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - auditor
      - cluster_head
      - director
      - owner
      - tenant_admin
  /v1/users/{id}:
    get:
      tags:
      - users
      summary: One user (management roles within their scope, or the user themselves)
      operationId: getUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not_found`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - auditor
      - cluster_head
      - director
      - owner
      - tenant_admin
      x-self: id
    patch:
      tags:
      - users
      summary: Change name, role, status, store or cluster of a user
      operationId: updateUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not_found`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - director
      - owner
      - tenant_admin
  /v1/farmers:
    get:
      tags:
      - farmers
      summary: Farmers visible to the caller (tenant, cluster, store or own), oldest first
      operationId: listFarmers
      parameters:
      - name: village_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Village Id
      - name: registered_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Officer user id.
          title: Registered By
        description: Officer user id.
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque cursor from `next_cursor`.
          title: Cursor
        description: Opaque cursor from `next_cursor`.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Page size.
          default: 50
          title: Limit
        description: Page size.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOut_FarmerOut_'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          description: '`invalid_cursor`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - agronomist
      - auditor
      - cluster_head
      - director
      - field_officer
      - owner
      - store_manager
      - tenant_admin
    post:
      tags:
      - farmers
      summary: Register a farmer with farms, crop plots and consent (FA-012, FA-013)
      operationId: createFarmer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmerCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerDetailOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not_found`'
          content:
            application/problem+json: {}
        '409':
          description: '`farmer_phone_exists`, `version_conflict`'
          content:
            application/problem+json: {}
        '422':
          description: '`farm_boundary_invalid`, `farmer_phone_is_staff`, `phone_verification_invalid`,
            `idempotency_key_reuse`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - cluster_head
      - field_officer
      - store_manager
      - tenant_admin
  /v1/farmers/phone/verify/send:
    post:
      tags:
      - farmers
      summary: Send an OTP to a farmer's phone before registration (VA-F01)
      operationId: sendFarmerPhoneOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneVerifySendRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneVerifySendResponse'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '423':
          description: '`otp_locked`'
          content:
            application/problem+json: {}
        '429':
          description: '`otp_rate_limited`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - cluster_head
      - field_officer
      - store_manager
      - tenant_admin
  /v1/farmers/phone/verify/confirm:
    post:
      tags:
      - farmers
      summary: Confirm the farmer's OTP; returns a 30-minute phone_verification_token
      operationId: confirmFarmerPhoneOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneVerifyConfirmRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneVerificationTokenOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`otp_invalid`, `otp_expired`, `unauthenticated`, `token_expired`, `user_disabled`'
          content:
            application/problem+json: {}
        '404':
          description: '`otp_not_found`'
          content:
            application/problem+json: {}
        '423':
          description: '`otp_locked`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - cluster_head
      - field_officer
      - store_manager
      - tenant_admin
  /v1/farmers/{id}/phone/verify/send:
    post:
      tags:
      - farmers
      summary: Send an OTP to verify the phone of an already registered farmer
      operationId: sendFarmerRecordPhoneOtp
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneVerifySendResponse'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not_found`'
          content:
            application/problem+json: {}
        '423':
          description: '`otp_locked`'
          content:
            application/problem+json: {}
        '429':
          description: '`otp_rate_limited`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - cluster_head
      - farmer
      - field_officer
      - store_manager
      - tenant_admin
  /v1/farmers/{id}/phone/verify/confirm:
    post:
      tags:
      - farmers
      summary: Confirm the OTP and mark the farmer's phone as verified
      operationId: confirmFarmerRecordPhoneOtp
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneVerifyCodeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not_found`, `otp_not_found`'
          content:
            application/problem+json: {}
        '401':
          description: '`otp_invalid`, `otp_expired`, `unauthenticated`, `token_expired`, `user_disabled`'
          content:
            application/problem+json: {}
        '423':
          description: '`otp_locked`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - cluster_head
      - farmer
      - field_officer
      - store_manager
      - tenant_admin
  /v1/farmers/{id}:
    get:
      tags:
      - farmers
      summary: One farmer with farms, crop plots and consent history
      operationId: getFarmer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerDetailOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not_found`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - agronomist
      - auditor
      - cluster_head
      - director
      - farmer
      - field_officer
      - owner
      - store_manager
      - tenant_admin
    patch:
      tags:
      - farmers
      summary: Change name, village, landmark, language or land ownership
      operationId: updateFarmer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmerUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not_found`'
          content:
            application/problem+json: {}
        '409':
          description: '`version_conflict`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - cluster_head
      - farmer
      - field_officer
      - store_manager
      - tenant_admin
  /v1/farmers/{id}/farms:
    post:
      tags:
      - farmers
      summary: Add a farm (with crop plots and photos) to a farmer
      operationId: createFarm
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not_found`'
          content:
            application/problem+json: {}
        '409':
          description: '`farmer_phone_exists`, `version_conflict`'
          content:
            application/problem+json: {}
        '422':
          description: '`farm_boundary_invalid`, `farmer_phone_is_staff`, `phone_verification_invalid`,
            `idempotency_key_reuse`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - cluster_head
      - farmer
      - field_officer
      - store_manager
      - tenant_admin
  /v1/farmers/{id}/consents:
    post:
      tags:
      - farmers
      summary: Append a consent grant or withdrawal (FM-002)
      operationId: createConsent
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecordOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not_found`'
          content:
            application/problem+json: {}
        '422':
          description: '`idempotency_key_reuse`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - cluster_head
      - farmer
      - field_officer
      - store_manager
      - tenant_admin
  /v1/farms/{id}:
    patch:
      tags:
      - farmers
      summary: Change a farm (boundary re-checked, photos replaced when given)
      operationId: updateFarm
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not_found`'
          content:
            application/problem+json: {}
        '409':
          description: '`version_conflict`'
          content:
            application/problem+json: {}
        '422':
          description: '`farm_boundary_invalid`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - cluster_head
      - farmer
      - field_officer
      - store_manager
      - tenant_admin
    delete:
      tags:
      - farmers
      summary: Soft-delete a farm and its crop plots
      operationId: deleteFarm
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '204':
          description: Successful Response
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not_found`'
          content:
