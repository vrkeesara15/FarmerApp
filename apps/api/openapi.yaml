openapi: 3.1.0
info:
  title: FarmerApp API
  description: FarmerApp REST API. Errors are RFC 9457 problem+json with a stable `code`.
  version: 0.1.0
paths:
  /v1/health:
    get:
      tags:
      - health
      summary: Liveness probe
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-public: true
  /v1/auth/otp/send:
    post:
      tags:
      - auth
      summary: Send a 6-digit login code by SMS (WhatsApp fallback after 30 s)
      operationId: sendOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSendRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSendResponse'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`user_not_found`'
          content:
            application/problem+json: {}
        '403':
          description: '`user_disabled`'
          content:
            application/problem+json: {}
        '423':
          description: '`otp_locked`'
          content:
            application/problem+json: {}
        '429':
          description: '`otp_rate_limited`'
          content:
            application/problem+json: {}
      x-public: true
  /v1/auth/otp/verify:
    post:
      tags:
      - auth
      summary: Verify the code; returns access + refresh tokens and the user profile
      operationId: verifyOtp
      parameters:
      - name: X-Integrity-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'SEC-024: Play Integrity standard token bound to this request (requestHash). Verified
            server-side; never blocks.'
          title: X-Integrity-Token
        description: 'SEC-024: Play Integrity standard token bound to this request (requestHash). Verified
          server-side; never blocks.'
      - name: X-Integrity-Status
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: '`unavailable` when the app could not get a token (never blocks).'
          title: X-Integrity-Status
        description: '`unavailable` when the app could not get a token (never blocks).'
      - name: X-Integrity-Action
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Comma list of sensitive actions: login, credit_sale, payment_collection, day_close.'
          title: X-Integrity-Action
        description: 'Comma list of sensitive actions: login, credit_sale, payment_collection, day_close.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`otp_invalid`, `otp_expired`, `device_wipe_required`'
          content:
            application/problem+json: {}
        '404':
          description: '`otp_not_found`, `user_not_found`'
          content:
            application/problem+json: {}
        '403':
          description: '`user_disabled`'
          content:
            application/problem+json: {}
        '409':
          description: '`device_not_bound`'
          content:
            application/problem+json: {}
        '422':
          description: '`device_id_required`'
          content:
            application/problem+json: {}
        '423':
          description: '`otp_locked`'
          content:
            application/problem+json: {}
      x-public: true
  /v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Rotate the refresh token and issue a new access token
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`refresh_invalid`, `refresh_expired`, `refresh_reused`, `refresh_device_mismatch`,
            `session_revoked`, `device_wipe_required`'
          content:
            application/problem+json: {}
        '403':
          description: '`user_disabled`'
          content:
            application/problem+json: {}
      x-public: true
  /v1/auth/logout:
    post:
      tags:
      - auth
      summary: Revoke the refresh token family (idempotent)
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-public: true
  /v1/auth/step-up/send:
    post:
      tags:
      - auth
      summary: 'SEC-028: send a re-authentication code to the caller''s own phone'
      operationId: sendStepUpOtp
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSendResponse'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '423':
          description: '`otp_locked`'
          content:
            application/problem+json: {}
        '429':
          description: '`otp_rate_limited`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`, `session_revoked`, `device_wipe_required`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - accountant
      - agronomist
      - auditor
      - cluster_head
      - director
      - farmer
      - field_officer
      - owner
      - store_manager
      - tenant_admin
  /v1/auth/step-up:
    post:
      tags:
      - auth
      summary: 'SEC-028: verify the code; returns a 5-minute step-up token for admin actions'
      operationId: verifyStepUp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpTokenResponse'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`otp_invalid`, `otp_expired`, `unauthenticated`, `token_expired`, `user_disabled`,
            `session_revoked`, `device_wipe_required`'
          content:
            application/problem+json: {}
        '404':
          description: '`otp_not_found`'
          content:
            application/problem+json: {}
        '423':
          description: '`otp_locked`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - accountant
      - agronomist
      - auditor
      - cluster_head
      - director
      - farmer
      - field_officer
      - owner
      - store_manager
      - tenant_admin
  /v1/me:
    get:
      tags:
      - me
      summary: Profile of the authenticated user
      operationId: getMe
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`, `session_revoked`, `device_wipe_required`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - accountant
      - agronomist
      - auditor
      - cluster_head
      - director
      - farmer
      - field_officer
      - owner
      - store_manager
      - tenant_admin
  /v1/users:
    get:
      tags:
      - users
      summary: 'Users of the caller''s tenant with device status (cluster heads: own cluster)'
      operationId: listUsers
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque cursor from `next_cursor`.
          title: Cursor
        description: Opaque cursor from `next_cursor`.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Page size.
          default: 50
          title: Limit
        description: Page size.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOut_UserListItem_'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          description: '`invalid_cursor`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`, `session_revoked`, `device_wipe_required`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - auditor
      - cluster_head
      - director
      - owner
      - tenant_admin
    post:
      tags:
      - users
      summary: Create a staff account (WC-011; step-up required)
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`step_up_required`, `unauthenticated`, `token_expired`, `user_disabled`, `session_revoked`,
            `device_wipe_required`'
          content:
            application/problem+json: {}
        '403':
          description: '`role_not_grantable`, `forbidden`'
          content:
            application/problem+json: {}
        '409':
          description: '`phone_taken`'
          content:
            application/problem+json: {}
        '422':
          description: '`invalid_assignment`'
          content:
            application/problem+json: {}
      x-step-up: true
      x-roles:
      - director
      - owner
      - tenant_admin
  /v1/users/{id}:
    get:
      tags:
      - users
      summary: One user (management roles within their scope, or the user themselves)
      operationId: getUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not_found`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`, `session_revoked`, `device_wipe_required`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - auditor
      - cluster_head
      - director
      - owner
      - tenant_admin
      x-self: id
    patch:
      tags:
      - users
      summary: Change name, role, status, store or cluster (role / status need step-up)
      operationId: updateUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not_found`'
          content:
            application/problem+json: {}
        '401':
          description: '`step_up_required`, `unauthenticated`, `token_expired`, `user_disabled`, `session_revoked`,
            `device_wipe_required`'
          content:
            application/problem+json: {}
        '403':
          description: '`role_not_grantable`, `cannot_modify_self`, `forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - director
      - owner
      - tenant_admin
  /v1/users/{id}/deactivate:
    post:
      tags:
      - users
      summary: 'Disable an account: signed out everywhere, apps wipe local data (step-up)'
      operationId: deactivateUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not_found`'
          content:
            application/problem+json: {}
        '401':
          description: '`step_up_required`, `unauthenticated`, `token_expired`, `user_disabled`, `session_revoked`,
            `device_wipe_required`'
          content:
            application/problem+json: {}
        '403':
          description: '`role_not_grantable`, `cannot_modify_self`, `forbidden`'
          content:
            application/problem+json: {}
      x-step-up: true
      x-roles:
      - director
      - owner
      - tenant_admin
  /v1/users/{id}/force-logout:
    post:
      tags:
      - users
      summary: Sign a user out of every device within the revocation window (step-up)
      operationId: forceLogoutUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForceLogoutOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not_found`'
          content:
            application/problem+json: {}
        '401':
          description: '`step_up_required`, `unauthenticated`, `token_expired`, `user_disabled`, `session_revoked`,
            `device_wipe_required`'
          content:
            application/problem+json: {}
        '403':
          description: '`role_not_grantable`, `forbidden`'
          content:
            application/problem+json: {}
      x-step-up: true
      x-roles:
      - director
      - owner
      - tenant_admin
  /v1/users/{id}/devices:
    get:
      tags:
      - users
      summary: Devices a user has signed in from (pending ones await binding)
      operationId: listUserDevices
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not_found`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`, `session_revoked`, `device_wipe_required`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - auditor
      - cluster_head
      - director
      - owner
      - tenant_admin
  /v1/users/{id}/devices/{device_id}/bind:
    post:
      tags:
      - users
      summary: 'Bind a device (field officers: unbinds and signs out the previous one; step-up)'
      operationId: bindUserDevice
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not_found`'
          content:
            application/problem+json: {}
        '401':
          description: '`step_up_required`, `unauthenticated`, `token_expired`, `user_disabled`, `session_revoked`,
            `device_wipe_required`'
          content:
            application/problem+json: {}
        '403':
          description: '`role_not_grantable`, `forbidden`'
          content:
            application/problem+json: {}
      x-step-up: true
      x-roles:
      - director
      - owner
      - tenant_admin
  /v1/users/{id}/devices/{device_id}/report-lost:
    post:
      tags:
      - users
      summary: 'Mark a device lost: its sessions end and its app wipes local data (step-up)'
      operationId: reportUserDeviceLost
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not_found`'
          content:
            application/problem+json: {}
        '401':
          description: '`step_up_required`, `unauthenticated`, `token_expired`, `user_disabled`, `session_revoked`,
            `device_wipe_required`'
          content:
            application/problem+json: {}
        '403':
          description: '`role_not_grantable`, `forbidden`'
          content:
            application/problem+json: {}
      x-step-up: true
      x-roles:
      - director
      - owner
      - tenant_admin
  /v1/devices/me/status:
    get:
      tags:
      - users
      summary: 'SEC-025: this device''s status; the apps poll it on start and wipe when told'
      operationId: getMyDeviceStatus
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatusOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`, `session_revoked`, `device_wipe_required`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - accountant
      - agronomist
      - auditor
      - cluster_head
      - director
      - farmer
      - field_officer
      - owner
      - store_manager
      - tenant_admin
  /v1/farmers:
    get:
      tags:
      - farmers
      summary: Farmers visible to the caller (tenant, cluster, store or own), oldest first
      operationId: listFarmers
      parameters:
      - name: village_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Village Id
      - name: registered_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Officer user id.
          title: Registered By
        description: Officer user id.
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque cursor from `next_cursor`.
          title: Cursor
        description: Opaque cursor from `next_cursor`.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Page size.
          default: 50
          title: Limit
        description: Page size.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOut_FarmerOut_'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          description: '`invalid_cursor`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`, `session_revoked`, `device_wipe_required`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - agronomist
      - auditor
      - cluster_head
      - director
      - field_officer
      - owner
      - store_manager
      - tenant_admin
    post:
      tags:
      - farmers
      summary: Register a farmer with farms, crop plots and consent (FA-012, FA-013)
      operationId: createFarmer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmerCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerDetailOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not_found`'
          content:
            application/problem+json: {}
        '409':
          description: '`farmer_phone_exists`, `version_conflict`'
          content:
            application/problem+json: {}
        '422':
          description: '`farm_boundary_invalid`, `farmer_phone_is_staff`, `phone_verification_invalid`,
            `idempotency_key_reuse`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`, `session_revoked`, `device_wipe_required`'
          content:
