openapi: 3.1.0
info:
  title: FarmerApp API
  description: FarmerApp REST API. Errors are RFC 9457 problem+json with a stable `code`.
  version: 0.1.0
paths:
  /v1/health:
    get:
      tags:
      - health
      summary: Liveness probe
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-public: true
  /v1/auth/otp/send:
    post:
      tags:
      - auth
      summary: Send a 6-digit login code by SMS (WhatsApp fallback after 30 s)
      operationId: sendOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSendRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSendResponse'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`user_not_found`'
          content:
            application/problem+json: {}
        '403':
          description: '`user_disabled`'
          content:
            application/problem+json: {}
        '423':
          description: '`otp_locked`'
          content:
            application/problem+json: {}
        '429':
          description: '`otp_rate_limited`'
          content:
            application/problem+json: {}
      x-public: true
  /v1/auth/otp/verify:
    post:
      tags:
      - auth
      summary: Verify the code; returns access + refresh tokens and the user profile
      operationId: verifyOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`otp_invalid`, `otp_expired`'
          content:
            application/problem+json: {}
        '404':
          description: '`otp_not_found`, `user_not_found`'
          content:
            application/problem+json: {}
        '403':
          description: '`user_disabled`'
          content:
            application/problem+json: {}
        '423':
          description: '`otp_locked`'
          content:
            application/problem+json: {}
      x-public: true
  /v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Rotate the refresh token and issue a new access token
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`refresh_invalid`, `refresh_expired`, `refresh_reused`, `refresh_device_mismatch`'
          content:
            application/problem+json: {}
        '403':
          description: '`user_disabled`'
          content:
            application/problem+json: {}
      x-public: true
  /v1/auth/logout:
    post:
      tags:
      - auth
      summary: Revoke the refresh token family (idempotent)
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-public: true
  /v1/me:
    get:
      tags:
      - me
      summary: Profile of the authenticated user
      operationId: getMe
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - accountant
      - agronomist
      - auditor
      - cluster_head
      - director
      - farmer
      - field_officer
      - owner
      - store_manager
      - tenant_admin
  /v1/users:
    get:
      tags:
      - users
      summary: Users of the caller's tenant (cluster heads see their own cluster)
      operationId: listUsers
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque cursor from `next_cursor`.
          title: Cursor
        description: Opaque cursor from `next_cursor`.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Page size.
          default: 50
          title: Limit
        description: Page size.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOut_UserOut_'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          description: '`invalid_cursor`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - auditor
      - cluster_head
      - director
      - owner
      - tenant_admin
  /v1/users/{id}:
    get:
      tags:
      - users
      summary: One user (management roles within their scope, or the user themselves)
      operationId: getUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not_found`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - auditor
      - cluster_head
      - director
      - owner
      - tenant_admin
      x-self: id
    patch:
      tags:
      - users
      summary: Change name, role, status, store or cluster of a user
      operationId: updateUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not_found`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - director
      - owner
      - tenant_admin
  /v1/farmers:
    get:
      tags:
      - farmers
      summary: Farmers visible to the caller (tenant, cluster, store or own), oldest first
      operationId: listFarmers
      parameters:
      - name: village_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Village Id
      - name: registered_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Officer user id.
          title: Registered By
        description: Officer user id.
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque cursor from `next_cursor`.
          title: Cursor
        description: Opaque cursor from `next_cursor`.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Page size.
          default: 50
          title: Limit
        description: Page size.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOut_FarmerOut_'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          description: '`invalid_cursor`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - agronomist
      - auditor
      - cluster_head
      - director
      - field_officer
      - owner
      - store_manager
      - tenant_admin
  /v1/farmers/{id}:
    get:
      tags:
      - farmers
      summary: One farmer with farms, crop plots and consent history
      operationId: getFarmer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerDetailOut'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not_found`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - agronomist
      - auditor
      - cluster_head
      - director
      - farmer
      - field_officer
      - owner
      - store_manager
      - tenant_admin
  /v1/audit-logs:
    get:
      tags:
      - audit
      summary: Audit trail of the caller's tenant, newest first
      operationId: listAuditLogs
      parameters:
      - name: entity
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          description: Table name.
          title: Entity
        description: Table name.
      - name: entity_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Entity Id
      - name: actor_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Actor Id
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          description: e.g. `user.update`.
          title: Action
        description: e.g. `user.update`.
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Rows at or after this instant.
          title: From
        description: Rows at or after this instant.
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Rows at or before this instant.
          title: To
        description: Rows at or before this instant.
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque cursor from `next_cursor`.
          title: Cursor
        description: Opaque cursor from `next_cursor`.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Page size.
          default: 50
          title: Limit
        description: Page size.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOut_AuditLogOut_'
        default:
          description: Error (RFC 9457 problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          description: '`invalid_cursor`'
          content:
            application/problem+json: {}
        '401':
          description: '`unauthenticated`, `token_expired`, `user_disabled`'
          content:
            application/problem+json: {}
        '403':
          description: '`forbidden`'
          content:
            application/problem+json: {}
      x-roles:
      - auditor
      - director
      - owner
      - tenant_admin
components:
  schemas:
    AuditLogOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        tenant_id:
          type: string
          format: uuid
          title: Tenant Id
        actor_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Actor Id
        actor_role:
          type: string
          title: Actor Role
        action:
          type: string
          title: Action
        entity:
          type: string
          title: Entity
        entity_id:
          type: string
          format: uuid
          title: Entity Id
        before:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Before
        after:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: After
        ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip
        device_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Id
        user_agent:
          anyOf:
          - type: string
          - type: 'null'
          title: User Agent
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - tenant_id
      - actor_id
      - actor_role
      - action
      - entity
      - entity_id
      - before
      - after
      - ip
      - device_id
      - user_agent
      - trace_id
      - created_at
      title: AuditLogOut
    ConsentRecordOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        purpose:
          type: string
          title: Purpose
        version:
          type: string
          title: Version
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        granted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Granted At
        withdrawn_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Withdrawn At
        channel:
          type: string
          title: Channel
        recorded_by:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Recorded By
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - purpose
      - version
      - language
      - granted_at
      - withdrawn_at
      - channel
      - recorded_by
      - created_at
      title: ConsentRecordOut
    CropPlotOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        farm_id:
          type: string
          format: uuid
          title: Farm Id
        crop_id:
          type: string
          format: uuid
          title: Crop Id
        variety:
          anyOf:
          - type: string
          - type: 'null'
          title: Variety
        season:
          type: string
          title: Season
        sowing_date:
          type: string
          format: date
          title: Sowing Date
        stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Stage
        expected_harvest:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Expected Harvest
        area_acres:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Area Acres
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        version:
          type: integer
          title: Version
      type: object
      required:
      - id
      - farm_id
      - crop_id
      - variety
      - season
      - sowing_date
      - stage
      - expected_harvest
      - area_acres
      - created_at
      - updated_at
      - version
      title: CropPlotOut
    FarmOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        farmer_id:
          type: string
          format: uuid
          title: Farmer Id
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        survey_no:
          anyOf:
          - type: string
          - type: 'null'
          title: Survey No
        boundary:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Boundary
          description: GeoJSON Polygon (WGS84).
        centroid:
          anyOf:
          - $ref: '#/components/schemas/LatLon'
          - type: 'null'
        area_acres:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Area Acres
          description: Declared by the officer / farmer.
        area_acres_computed:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Area Acres Computed
          description: ST_Area of the boundary in acres.
        soil:
          anyOf:
          - type: string
          - type: 'null'
          title: Soil
        irrigation:
          anyOf:
          - type: string
          - type: 'null'
          title: Irrigation
        ownership:
          anyOf:
          - type: string
          - type: 'null'
          title: Ownership
        crop_plots:
          items:
            $ref: '#/components/schemas/CropPlotOut'
          type: array
          title: Crop Plots
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        version:
          type: integer
          title: Version
      type: object
      required:
      - id
      - farmer_id
      - name
      - survey_no
      - boundary
      - centroid
      - area_acres
      - area_acres_computed
      - soil
      - irrigation
      - ownership
      - created_at
      - updated_at
      - version
      title: FarmOut
    FarmerDetailOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        tenant_id:
          type: string
          format: uuid
          title: Tenant Id
        phone:
          type: string
          title: Phone
        phone_last4:
          type: string
          title: Phone Last4
        name:
          type: string
          title: Name
        village_id:
          type: string
          format: uuid
          title: Village Id
        landmark:
          anyOf:
          - type: string
          - type: 'null'
          title: Landmark
        language:
          type: string
          title: Language
        consent_marketing:
          type: boolean
          title: Consent Marketing
        consent_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Consent Version
        registered_by:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Registered By
        user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: User Id
        source:
          type: string
          title: Source
        land_ownership:
          anyOf:
          - type: string
          - type: 'null'
          title: Land Ownership
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        version:
          type: integer
          title: Version
        farms:
          items:
            $ref: '#/components/schemas/FarmOut'
          type: array
          title: Farms
        consents:
          items:
            $ref: '#/components/schemas/ConsentRecordOut'
          type: array
          title: Consents
      type: object
      required:
      - id
      - tenant_id
      - phone
      - phone_last4
      - name
      - village_id
      - landmark
      - language
      - consent_marketing
      - consent_version
      - registered_by
      - user_id
      - source
      - land_ownership
      - created_at
      - updated_at
      - version
      title: FarmerDetailOut
      description: 'Farmer 360 (WC-003): the farmer with farms, crop plots and consent history.'
    FarmerOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        tenant_id:
          type: string
          format: uuid
          title: Tenant Id
        phone:
          type: string
          title: Phone
        phone_last4:
          type: string
          title: Phone Last4
        name:
          type: string
          title: Name
        village_id:
          type: string
          format: uuid
          title: Village Id
        landmark:
          anyOf:
          - type: string
          - type: 'null'
          title: Landmark
        language:
          type: string
          title: Language
        consent_marketing:
          type: boolean
          title: Consent Marketing
        consent_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Consent Version
        registered_by:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Registered By
        user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: User Id
        source:
          type: string
          title: Source
        land_ownership:
          anyOf:
          - type: string
          - type: 'null'
          title: Land Ownership
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        version:
          type: integer
          title: Version
      type: object
      required:
      - id
      - tenant_id
      - phone
