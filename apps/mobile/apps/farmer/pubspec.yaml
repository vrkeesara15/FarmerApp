name: farmerapp_farmer
description: FarmerApp farmer app (Kisan).
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  farmerapp_core:
    path: ../../packages/core
  firebase_core: ^4.1.1
  # NF-014 / SPEC 8.4: crash-free sessions per version (OPS-002), cold-start and
  # network traces (NF-005), and the remote kill switches. All three are optional:
  # without google-services.json the adapters in lib/observability.dart fall back to
  # the core's no-op seams and the app runs unchanged.
  firebase_crashlytics: ^5.4.0
  firebase_messaging: ^16.0.3
  firebase_performance: ^0.11.6
  firebase_remote_config: ^6.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_tts: ^4.2.3
  go_router: ^18.0.1
  http: ^1.6.0
  mobile_scanner: ^7.4.2
  share_plus: ^13.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  drift: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  image: ^4.10.1

flutter:
  uses-material-design: true
