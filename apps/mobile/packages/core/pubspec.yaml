name: farmerapp_core
description: FarmerApp shared mobile core - design tokens, themes, widgets, i18n, local DB and sync utilities.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  async: ^2.13.0
  battery_plus: ^7.1.1
  connectivity_plus: ^7.0.0
  crypto: ^3.0.7
  drift: ^2.35.0
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.0.3
  http: ^1.6.0
  image: ^4.10.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  latlong2: ^0.10.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  qr_flutter: ^4.1.0
  safe_device: ^1.4.1
  timezone: ^0.11.1
  workmanager: ^0.10.10

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  sqlite3: ^3.0.0

flutter:
  generate: true
